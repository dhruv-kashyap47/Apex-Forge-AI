name: ApexForge AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=.git,__pycache__,.venv,rapidfuzz,sentence_transformers \
            --extend-ignore=E402,E501,E203,E221,E231,E251,E272,W503,E127,E131,E701

      - name: Run tests
        run: pytest tests/ -v --tb=short 2>/dev/null || echo "No tests yet"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t apexforge-ai:ci .

      - name: Test Docker Compose starts
        run: |
          cp .env.example .env
          docker compose up -d postgres
          sleep 15
          docker compose ps
          docker compose down
